;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px\"><span style=\"width:56px;height:56px;border-radius:50%;background:#0B6E70;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center\">2<\u002Fspan><b>Press SOS for 2 seconds<\u002Fb><span style=\"font-size:14px;color:#55636D\">The hold stops accidental alerts.<\u002Fspan><\u002Fli>\n<li style=\"flex:1 1 160px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px\"><span style=\"width:56px;height:56px;border-radius:50%;background:#0B6E70;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center\">3<\u002Fspan><b>Band takes 3 photos<\u002Fb><span style=\"font-size:14px;color:#55636D\">Saves the date and time, with your location from your phone.<\u002Fspan><\u002Fli>\n<li style=\"flex:1 1 160px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px\"><span style=\"width:56px;height:56px;border-radius:50%;background:#0B6E70;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center\">4<\u002Fspan><b>Sent to the SafeBand app<\u002Fb><span style=\"font-size:14px;color:#55636D\">Over Bluetooth to your phone.<\u002Fspan><\u002Fli>\n<li style=\"flex:1 1 160px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px\"><span style=\"width:56px;height:56px;border-radius:50%;background:#0B6E70;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center\">5<\u002Fspan><b>Alerts reach your people<\u002Fb><span style=\"font-size:14px;color:#55636D\">Family and friends, by WhatsApp or SMS.<\u002Fspan><\u002Fli>\n<li style=\"flex:1 1 160px;min-width:0;display:flex;flex-direct idden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><div><b>A safety check you can trust.<\u002Fb> Seven quick checks cover Bluetooth, location, notifications and contacts, each with a fix button.<\u002Fdiv><\u002Fli>\n<li style=\"display:flex;gap:12px\"><span style=\"color:#0B6E70;flex:none;margin-top:1px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><div><b>See who was reached.<\u002Fb> Every alert shows which contact received it, and by which channel.<\u002Fdiv><\u002Fli>\n<li style=\"display:flex;gap:12px\"><span style=\"color:#0B6E70;flex:none;margin-top:1px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><div><b>More ways out.<\u002Fb> A check-in timer that alerts your contacts if you do not tap \"I'm safe\", and a fake call to leave a situation.<\u002Fdiv><\u002Fli>\n<\u002Ful>\n<p style=\"font-size:14px;color:#55636D\">SOS is sent only from the physical band, never from a button in the app, so it can't be sent by accident.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;justify-content:center;gap:24px\">\n<div style=\"width:250px;position:relative;border:8px solid #1B242C;border-radius:38px;overflow:hidden;background:#F3F7F8\">\n<img src=\"707b7b23-4d8b-4fc5-a42e-3330311b3b91\" alt=\"SafeBand app home screen: band ready, 92 percent battery, safety check\" style=\"display:block;width:100%;height:auto\">\n<div style=\"position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,rgba(243,247,248,0),#F3F7F8)\"><\u002Fdiv>\n<\u002Fd ay:flex;flex-direction:column;gap:10px\">\n<span style=\"font-size:12px;letter-spacing:.12em;font-weight:700;color:#A5B3BC\">LIVE LOCATION<\u002Fspan>\n<div style=\"aspect-ratio:2/1;background:#2E3C45;border-radius:8px;display:flex;align-items:center;justify-content:center\"><span style=\"width:16px;height:16px;border-radius:50%;background:#3CC3C6;border:3px solid #FFFFFF;display:block;box-sizing:border-box\"><\u002Fspan><\u002Fdiv>\n<span style=\"font-size:14px;color:#A5B3BC\">Updated as the wearer moves<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;color:#A5B3BC\">Illustration of the planned response-team view. Layout and details will change.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n<span style=\"align-self:flex-start;background:#DDF1F1;color:#095A5C;font-weight:700;font-size:13px;letter-spacing:.08em;padding:5px 12px;border-radius:99px\">COMING SOON<\u002Fspan>\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.1\">A response team that sees what you saw<\u002Fh2>\n<p style=\"color:#3B4953;font-size:18px\">For families, schools and security partners: one view with the photos, the time and where the wearer is, so help can act on facts instead of a panicked phone call.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"max-width:1200px;margin:0 auto;padding:0 24px 72px\">\n<div style=\"background:#DDF1F1;border-radius:24px;padding:32px;display:flex;flex-wrap:wrap;gap:28px\">\n<div style=\"flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px\"><h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:#095A5C\">Discreet and stylish<\u002Fh3><p style=\"font-size:15px;color:#2C3A44\">Looks like a fashion band. Works like a guardian.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px\"><h3 style=\"font-fa
